# ============================
#   SmartWithdraw Config
# ============================

branding:
  server-name: "YourServerName"

# Define as many currencies as you want. Each one gets its own note
# skin, name, denomination list, BACKEND (actual balance it draws
# from), and a Satchel-style tooltip.
#
# backend options:
#   VAULT        - your Vault-linked economy plugin (e.g. EssentialsX)
#   PLAYERPOINTS - PlayerPoints plugin balance (requires PlayerPoints installed)
#   XP           - the player's own experience points/levels (no plugin needed)
#
# Exactly one currency should have "default: true".
currencies:
  coins:
    enabled: true
    default: true
    symbol: "$"
    name: "Money"
    name-plural: "Money"
    format: "%symbol%%amount%"
    denominations: [1, 10, 50, 100, 500, 2000]
    model-data-base: 1000
    backend: VAULT
    lore:
      title-color: "&e"
      show-tier: true
      tier: "Common Tier"
      gain-text: "money"
      tax-percent: 0.0

  points:
    enabled: true
    default: false
    symbol: "⭐"
    name: "GamePoints"
    name-plural: "GamePoints"
    format: "%amount% %name% %symbol%"
    denominations: [1, 10, 50, 100]
    model-data-base: 9000
    backend: PLAYERPOINTS
    lore:
      title-color: "&a"
      show-tier: false
      tier: "Common Tier"
      gain-text: "game points"
      tax-percent: 0.0

  xp:
    enabled: true
    default: false
    symbol: "✵"
    name: "Experience"
    name-plural: "Experience"
    format: "%amount% %name% %symbol%"
    denominations: [1, 10, 30, 100]
    model-data-base: 9500
    backend: XP
    lore:
      title-color: "&e"
      show-tier: true
      tier: "Common Tier"
      gain-text: "experience"
      tax-percent: 0.0

notes:
  right-click-deposit: true
  deposit-method: RIGHT_CLICK

  # false -> withdrawing an amount gives ONE custom note for the exact
  #          amount (e.g. /withdraw 2500 -> one "$2500" note)
  # true  -> withdrawing an amount is broken into the fewest real
  #          notes possible using the denominations above
  #          (e.g. /withdraw 2500 -> one $2000 note + one $500 note)
  auto-split-notes: false

  # true -> sneak + left-click a note to manually break it into
  #         smaller denominations at any time (independent of the
  #         auto-split-notes setting above)
  allow-splitting: true

  # purely cosmetic: adds an enchantment glint to note items
  glow-effect: false

  # what to call note items in their tooltip title, e.g.
  # "Money Satchel", "Money Note", "Money Voucher"
  type-label: "Satchel"

limits:
  # seconds a player must wait between /withdraw uses (0 = disabled)
  withdraw-cooldown-seconds: 5
  # seconds a player must wait between /deposit uses (0 = disabled)
  deposit-cooldown-seconds: 0
  # maximum total note value (per currency) a player may hold at once (0 = unlimited)
  max-held-value: 0

logging:
  enabled: true
  file: "transactions.log"

# Auto-generated on first run, do not share this value.
# It is used to cryptographically sign notes so they cannot be forged.
security:
  secret: ""

resource-pack:
  enabled: false
  force: false
  url: ""
  sha1: ""

messages:
  prefix: "&6&lSmartWithdraw &8» "
  withdraw-success: "&aSuccessfully withdrew &f%amount%"
  insufficient-funds: "&cYou do not have enough money."
  invalid-amount: "&cPlease enter a valid amount."
  deposit-success: "&aDeposited &f%amount%"
  no-notes-to-deposit: "&cYou have no valid notes to deposit."
  no-permission: "&cYou do not have permission to do that."
  on-cooldown: "&cPlease wait %seconds%s before doing that again."
  held-limit-exceeded: "&cYou can only hold %limit% at once."
  invalid-note-detected: "&cThat note failed verification and was rejected."
  reload-success: "&aConfiguration reloaded."
  give-success: "&aGave %player% %amount%."
  give-received: "&aYou received %amount% from an admin."
  unknown-currency: "&cUnknown currency: %currency%"
  cannot-split: "&cThis note cannot be split any smaller."
  split-success: "&aSplit a %amount% note into smaller notes."
  backend-unavailable: "&c%currency% is currently unavailable (its plugin may be missing)."
  currency-disabled: "&cThat currency is currently disabled."
