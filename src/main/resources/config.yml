# ============================
#   SmartWithdraw Config
# ============================

branding:
  server-name: "YourServerName"

# ── CURRENCIES ───────────────────────────────────────────────────────
# backend: VAULT | PLAYERPOINTS | XP
# expiry-days: 0 = never expires
# daily-limit: 0 = unlimited per 24hr rolling window
# allowed-worlds: [] = all worlds allowed
#
currencies:
  coins:
    enabled: true
    default: true
    symbol: "$"
    name: "Money"
    name-plural: "Money"
    format: "%symbol%%amount%"
    denominations: [1, 10, 50, 100, 500, 2000]
    model-data-base: 1000
    backend: VAULT
    expiry-days: 0
    daily-limit: 0
    allowed-worlds: []
    tax:
      percent: 0.0
      apply-on-withdraw: false
      apply-on-deposit: false
    lore:
      title-color: "&e"
      show-tier: true
      tier: "Common Tier"
      gain-text: "money"
      template:
        - "&7Use this %type% to gain money!"
        - ""
        - "&f&lInformation:"
        - "&7- Value: &a%value%"
        - "&7- Created by: &6%server%, on %date%"
        - "&7- Expires in: &e%expiry%"
        - ""
        - "&7- Tax: &c%tax%"
        - ""
        - "&7[Right-Click to use]"
        - "&8[Shift+Right-Click stack to deposit all]"
        - "&8[Sneak+Left-Click to split]"

  points:
    enabled: true
    default: false
    symbol: "⭐"
    name: "GamePoints"
    name-plural: "GamePoints"
    format: "%amount% %name% %symbol%"
    denominations: [1, 10, 50, 100]
    model-data-base: 9000
    backend: PLAYERPOINTS
    expiry-days: 0
    daily-limit: 0
    allowed-worlds: []
    tax:
      percent: 0.0
      apply-on-withdraw: false
      apply-on-deposit: false
    lore:
      title-color: "&a"
      show-tier: false
      tier: "Common Tier"
      gain-text: "game points"
      template:
        - "&7Use this %type% to gain game points!"
        - ""
        - "&f&lInformation:"
        - "&7- Value: &a%value%"
        - "&7- Created by: &6%server%, on %date%"
        - "&7- Expires in: &e%expiry%"
        - ""
        - "&7- Tax: &c%tax%"
        - ""
        - "&7[Right-Click to use]"
        - "&8[Shift+Right-Click stack to deposit all]"
        - "&8[Sneak+Left-Click to split]"

  xp:
    enabled: true
    default: false
    symbol: "✵"
    name: "Experience"
    name-plural: "Experience"
    format: "%amount% %name% %symbol%"
    denominations: [1, 10, 30, 100]
    model-data-base: 9500
    backend: XP
    expiry-days: 0
    daily-limit: 0
    allowed-worlds: []
    tax:
      percent: 0.0
      apply-on-withdraw: false
      apply-on-deposit: false
    lore:
      title-color: "&e"
      show-tier: true
      tier: "Common Tier"
      gain-text: "experience"
      template:
        - "&7Use this %type% to gain experience!"
        - ""
        - "&f&lInformation:"
        - "&7- Value: &a%value%"
        - "&7- Created by: &6%server%, on %date%"
        - "&7- Expires in: &e%expiry%"
        - ""
        - "&7- Tax: &c%tax%"
        - ""
        - "&7[Right-Click to use]"
        - "&8[Shift+Right-Click stack to deposit all]"
        - "&8[Sneak+Left-Click to split]"

# ── NOTES ────────────────────────────────────────────────────────────
notes:
  right-click-deposit: true
  auto-split-notes: false
  allow-splitting: true
  glow-effect: false
  type-label: "Satchel"

# ── SOUNDS ───────────────────────────────────────────────────────────
sounds:
  enabled: true
  withdraw: "ITEM_BOOK_PAGE_TURN"
  deposit: "ENTITY_EXPERIENCE_ORB_PICKUP"
  split: "ENTITY_ITEM_PICKUP"
  expire: "ENTITY_ITEM_BREAK"
  volume: 1.0
  pitch: 1.0

# ── LIMITS ───────────────────────────────────────────────────────────
limits:
  withdraw-cooldown-seconds: 5
  deposit-cooldown-seconds: 0
  max-held-value: 0

# ── EXPIRY ───────────────────────────────────────────────────────────
expiry:
  scan-interval-seconds: 30

# ── LOGGING ──────────────────────────────────────────────────────────
logging:
  enabled: true
  file: "transactions.log"

# ── SECURITY ─────────────────────────────────────────────────────────
# Auto-generated on first start. Used to sign every note cryptographically.
# ⚠ WARNING: Never edit or delete this value — all existing notes will
# become invalid and undepositable if you do.
security:
  secret: ""

# ── MESSAGES ─────────────────────────────────────────────────────────
messages:
  prefix: "&6&lSmartWithdraw &8» "
  withdraw-success: "&a&l✦ &aWithdrew &f%amount% &a✦"
  withdraw-success-taxed: "&a&l✦ &aWithdrew &f%amount% &8(&c-%tax% tax&8) &a✦"
  insufficient-funds: "&c&l✖ &cInsufficient balance."
  invalid-amount: "&c&l✖ &cPlease enter a valid positive amount."
  deposit-success: "&a&l✦ &aDeposited &f%amount% &a✦"
  deposit-success-taxed: "&a&l✦ &aDeposited &f%amount% &8(&c-%tax% tax&8) &a✦"
  no-notes-to-deposit: "&c&l✖ &cYou have no valid notes to deposit."
  no-permission: "&c&l✖ &cYou do not have permission."
  on-cooldown: "&c&l⏳ &cPlease wait &f%seconds%s &cbefore doing that again."
  held-limit-exceeded: "&c&l✖ &cYou can only hold &f%limit% &cat once."
  invalid-note-detected: "&c&l✖ &cThat note failed verification and was rejected."
  reload-success: "&a&l✔ &aConfiguration reloaded successfully."
  give-success: "&a&l✔ &aGave &f%player% &f%amount%&a."
  give-received: "&a&l✦ &aYou received &f%amount%&a from an admin."
  give-pending: "&a&l✔ &f%player% &ais offline. Notes will be delivered on login."
  unknown-currency: "&c&l✖ &cUnknown currency: &f%currency%"
  cannot-split: "&c&l✖ &cThis note cannot be split any further."
  split-success: "&a&l✦ &aSplit &f%amount% &ainto smaller notes &a✦"
  backend-unavailable: "&c&l✖ &c%currency% backend is currently unavailable."
  currency-disabled: "&c&l✖ &cThat currency is currently disabled."
  daily-limit-reached: "&c&l✖ &cDaily withdrawal limit of &f%limit% &creached for &f%currency%&c. Resets in &f%reset%&c."
  world-not-allowed: "&c&l✖ &cYou cannot use &f%currency% &cnotes in this world."
  note-expired: "&4&l💀 &cYour &f%amount% %currency% %type% &chas expired and was destroyed."
  daily-limit-info: "&7Daily withdrawn: &f%used%&7/&f%limit% &7(&f%currency%&7) — resets in &e%reset%"
