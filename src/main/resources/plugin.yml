name: SmartWithdraw
version: ${version}
main: com.smartwithdraw.SmartWithdraw
api-version: '1.21'

softdepend:
  - Vault
  - Essentials
  - PlaceholderAPI
  - PlayerPoints

commands:
  withdraw:
    description: Withdraw balance as notes
    usage: /withdraw <amount> [currency]
    permission: smartwithdraw.withdraw

  deposit:
    description: Deposit all notes in your inventory
    usage: /deposit
    permission: smartwithdraw.deposit

  smartwithdraw:
    description: SmartWithdraw main command
    usage: /smartwithdraw
    aliases:
      - sw

permissions:
  smartwithdraw.withdraw:
    default: true
  smartwithdraw.deposit:
    default: true
  smartwithdraw.gui:
    default: true
  smartwithdraw.inspect:
    default: op
  smartwithdraw.currency.coins:
    default: true
  smartwithdraw.currency.points:
    default: true
  smartwithdraw.currency.xp:
    default: true
  smartwithdraw.admin.give:
    default: op
  smartwithdraw.admin.reload:
    default: op
  smartwithdraw.admin.update:
    default: op
  smartwithdraw.admin.health:
    default: op
