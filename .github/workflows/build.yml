name: Build SmartWithdraw

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Show Files
        run: ls -R

      - name: Verify Project
        run: |
          test -f build.gradle.kts
          test -f settings.gradle.kts
          test -f src/main/resources/plugin.yml

      - name: Success
        run: echo "Project structure verified!"
