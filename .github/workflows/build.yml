name: Build SmartWithdraw

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build
    run: gradle build

  - name: Upload Jar
    uses: actions/upload-artifact@v4
    with:
      name: SmartWithdraw
      path: build/libs/*.jar
```
